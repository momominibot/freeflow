name: FreeFlowPhone
options:
  bundleIdPrefix: com.momominibot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
targets:
  FreeFlowPhone:
    type: application
    platform: iOS
    sources:
      - path: App
      # the same text clean-up the Mac app uses (dictionary, fillers, spoken commands), so both stay in step
      - path: ../Sources/Text.swift
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FreeFlow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: FreeFlow listens while you dictate. The audio is turned into text on this iPhone and is never sent anywhere.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momominibot.freeflow.phone
        DEVELOPMENT_TEAM: X534KT8F6Z
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  FreeFlowPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FreeFlowPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momominibot.freeflow.phone.tests
        DEVELOPMENT_TEAM: X534KT8F6Z
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FreeFlowPhone:
    build:
      targets:
        FreeFlowPhone: all
    test:
      targets:
        - FreeFlowPhoneTests
