[package]
name = "harper-ffi"
version = "0.1.0"
edition = "2024"
description = "A small C interface to Harper (Apache-2.0, https://github.com/Automattic/harper) for FreeFlow."
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
harper-core = { path = "../harper-core" }
harper-thesaurus = { path = "../harper-thesaurus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
